<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생존일기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4f46e5">
<title>수술실 생존일기</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--sub:#6b7488;--main:#4f46e5;--line:#e3e7f0;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212d;--text:#e8ebf3;--sub:#9aa3b8;--main:#818cf8;--line:#2b3244;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:0 0 10px}
.hero{display:flex;gap:12px;align-items:center}
.lv{width:64px;height:64px;border-radius:50%;background:var(--main);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;flex:none}
.lv small{font-size:10px;font-weight:400}.lv b{font-size:22px;line-height:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--main);width:0;transition:width .5s}
.sub{color:var(--sub);font-size:12px}
label{display:block;font-size:13px;margin:10px 0 4px}
input,select,textarea,button{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button{background:var(--main);color:#fff;border:0;font-weight:700;margin-top:14px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{font-size:20px;display:block}
.item{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.item:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--line);margin-right:4px}
.del,.ed{width:auto;padding:2px 8px;margin:0;font-size:11px;background:none;color:var(--sub);border:1px solid var(--line);float:right}
#fb li{margin-bottom:6px}
#addType,#addSub,#addDept,#addDoc{margin-top:0;width:auto;flex:none;padding:9px 16px}
#newDept,#subDept{width:auto;flex:none}
.dsel,.ssel{width:auto;padding:2px 4px;font-size:12px;margin:4px 6px 0 0}
.x{cursor:pointer;margin-left:4px;padding:4px 6px;color:var(--sub)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dbtn{margin:0;padding:10px 4px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-size:14px}
.dbtn.on{background:var(--main);color:#fff;border-color:var(--main)}
.dbtn span{font-size:11px;opacity:.7}
.sbtn,.srt{width:auto;margin:0 6px 6px 0;padding:4px 10px;font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px}
.sbtn.on,.srt.on{background:var(--main);color:#fff;border-color:var(--main)}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-right:6px;padding:4px 6px 4px 0;font-size:16px;color:var(--sub)}
.item.drag{opacity:.45}
.item.over{outline:2px dashed var(--main);outline-offset:-2px}
.ngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.nbtn{margin:0;padding:8px 8px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-size:13px;text-align:left}
.nbtn.on{background:var(--main);color:#fff;border-color:var(--main)}
.nbtn span{font-size:11px;opacity:.7}
.dcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.dtitle{font-weight:700;margin-bottom:4px}
.dhead{cursor:pointer}
.memo{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:14px}
.mt{flex:1;white-space:pre-wrap;word-break:break-word}
.memo .ed{float:none;flex:none;margin:0}
.pref{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.pref>div{flex:1}
.pt{font-weight:700;font-size:12px;color:var(--main);margin-bottom:2px}
.pb{white-space:pre-wrap;word-break:break-word}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rname{font-size:14px;font-weight:700}
.rsub{font-size:12px;color:var(--sub);margin-top:2px}
.rday{font-size:15px;font-weight:700;text-align:right;flex:none}
.rbadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:2px}
.rday.ok{color:#16a34a}.rday.check{color:#d97706}.rday.review{color:#ef4444}
.rbadge.ok{background:rgba(22,163,74,.14)}.rbadge.check{background:rgba(217,119,6,.15)}.rbadge.review{background:rgba(239,68,68,.14)}
.pref .ed{float:none;flex:none;margin:0}
.dh{font-size:13px;font-weight:700;margin:12px 0 2px;color:var(--main)}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs>*{flex:1}
.tabbtn{margin:0;padding:9px 4px;background:var(--card);color:var(--sub);border:1px solid var(--line);font-size:13px}
.tabbtn.on{background:var(--main);color:#fff;border-color:var(--main)}
.tabs{overflow-x:auto}
.tabs>*{flex:1 0 auto}
.tabbtn{width:auto;white-space:nowrap;padding:9px 10px}
#askbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:20;font-size:14px}
#askbar button{margin-top:10px}
#askNo,#eNo,#pNo{background:var(--sub)}
#onboard{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#editbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#editbox .panel,#onboard .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:520px;margin:10px auto}
.ed{margin-right:6px}
#toast{z-index:50;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none}
</style>
</head>
<body>
<main>
<h1>🏥 수술실 생존일기</h1>

<div class="card hero">
  <div class="lv"><small>LV</small><b id="lv">1</b></div>
  <div style="flex:1">
    <div id="who" style="font-size:13px;color:var(--sub);cursor:pointer"></div>
    <div id="title" style="font-weight:700"></div>
    <div class="bar"><i id="xpbar"></i></div>
    <div class="sub" id="xptext"></div>
  </div>
</div>

<div class="card stats">
  <div><b id="sCount">0</b><span class="sub">총 수술</span></div>
  <div><b id="sTypes">0</b><span class="sub">수술 종류</span></div>
  <div><b id="sStreak">0</b><span class="sub">연속 기록일</span></div>
</div>

<div class="card">
  <h2>🗂️ 내 수술 목록</h2>
  <div class="dh" style="margin-top:0">과 추가</div>
  <div class="row" style="margin-bottom:6px"><input id="newDeptName" placeholder="과 추가 (예: VS)"><button id="addDept">과 추가</button></div>
  <div id="deptChips" style="margin-bottom:10px"></div>
  <div class="dh" style="margin-top:6px">🏷️ 분과 관리</div>
  <div class="row"><select id="subDept"></select><input id="newSub" placeholder="분과 추가 (예: 간담췌)"><button id="addSub">추가</button></div>
  <div id="subToggle" class="dh" style="cursor:pointer;margin:8px 0 4px"></div>
  <div id="subList" style="margin:0 0 10px" hidden></div>
  <div class="dh" style="margin-top:6px">수술명 추가</div>
  <div class="row"><input id="newType" placeholder="수술명 추가 (예: 복강경 담낭절제술)"><select id="newDept"></select><button id="addType">추가</button></div>
  <div id="typeList" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>🩺 집도의 목록</h2>
  <div class="row"><select id="docDept"></select><select id="docSub"></select></div>
  <div class="row" style="margin-top:6px"><input id="newDoc" placeholder="집도의 이름"><button id="addDoc">추가</button></div>
  <div id="docList" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>📝 오늘의 수술 기록</h2>
  <p class="sub" style="margin:0">⚠️ 환자 이름·등록번호 등 개인정보는 적지 마세요.</p>
  <label>날짜</label><input type="date" id="date">
  <div class="row">
    <div><label>수술명</label><select id="name"></select><button class="srt" id="newSurg" type="button" style="margin-top:6px">+ 새 수술</button></div>
    <div><label>수술 방식</label><select id="appr"></select></div>
  </div>
  <div class="row">
    <div><label>집도의</label><select id="doc"></select></div>
    <div><label>내 역할</label><select id="role"><option>소독간호사</option><option>순회간호사</option></select></div>
  </div>
  <div class="row">
    <div><label>난이도 (1~5)</label><select id="diff"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
    <div><label>내 만족도 (1~5)</label><select id="self"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
  </div>
  <label>메모 · 배운 점 (적으면 보너스 XP!)</label>
  <textarea id="memo" rows="3" placeholder="잘한 점, 아쉬운 점, 다음에 준비할 것"></textarea>
  <button id="save">기록하고 XP 얻기</button>
</div>

<div class="card"><h2>🕒 최근 경험</h2><div id="recentBox"></div></div>

<div class="card"><h2>📚 수술별 대시보드</h2><div id="list"></div></div>
<div class="card">
  <h2>💾 백업 / 복원</h2>
  <div id="backupBox">
    <p class="sub" style="margin:0">🔒 백업 파일에는 내 기록이 모두 들어 있어요. 안전한 곳에만 보관해 주세요.</p>
    <p class="sub" id="bkInfo"></p>
    <p class="sub" id="offInfo"></p>
    <div class="row"><button id="bkSave">백업 파일 저장</button><button id="bkCopy">백업 내용 복사</button></div>
    <label>복원: 백업 파일 선택</label>
    <input type="file" id="bkFile" accept=".json,application/json">
    <label>또는 백업 내용을 아래에 붙여넣기</label>
    <textarea id="bkText" rows="3" placeholder="복사한 백업 내용"></textarea>
    <button id="bkRestore">붙여넣은 내용으로 복원</button>
  </div>
</div>
</main>
<div id="toast"></div>
<div id="askbar"></div>
<div id="editbox"></div>
<div id="onboard"></div>

<script>
// 1) 저장소: 폰 브라우저에 기록을 보관
const KEY = "surgeryLog";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function store(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let logs = load();

// 내 수술 목록: 따로 저장. 처음엔 기존 기록의 수술명으로 채움
const TKEY = "surgeryTypes";
function loadTypes(){
  try{ const t = JSON.parse(localStorage.getItem(TKEY)); if (Array.isArray(t)) return t; }catch(e){}
  return [...new Set(logs.map(l => l.name))];
}
function storeTypes(){ try{ localStorage.setItem(TKEY, JSON.stringify(types)); }catch(e){} }
let types = loadTypes();
let selDept = null, selSub = "all";
let sortMode = "count";
let dashName = null;
let subOpen = false;
let openCards = new Set();
let prefNotes = loadObj("surgeryPrefNotes");
try{ sortMode = localStorage.getItem("surgerySort") === "manual" ? "manual" : "count"; }catch(e){}
function setSort(m){ sortMode = m; try{ localStorage.setItem("surgerySort", m); }catch(e){} }
function countOf(t){ return logs.filter(l => l.name === t).length; }

// 과(진료과) 분류: 수술명 → 과 이름을 따로 저장
const BASE = ["GS","OS","NS","CS","OB/GY","URO","ENT","PS","OPH"];
const CKEY = "surgeryCustomDepts";
let custom = [];
try{ custom = JSON.parse(localStorage.getItem(CKEY)) || []; }catch(e){}
function storeCustom(){ try{ localStorage.setItem(CKEY, JSON.stringify(custom)); }catch(e){} }
let DEPTS = [];
function buildDepts(){ DEPTS = [...BASE, ...custom, "ETC"]; }
buildDepts();
const OLD = {"일반외과":"GS","정형외과":"OS","신경외과":"NS","흉부외과":"CS","산부인과":"OB/GY","비뇨의학과":"URO","이비인후과":"ENT","성형외과":"PS","안과":"OPH","기타":"ETC"};
const DKEY = "surgeryDepts";
function loadDepts(){ try{ return JSON.parse(localStorage.getItem(DKEY)) || {}; }catch(e){ return {}; } }
function storeDepts(){ try{ localStorage.setItem(DKEY, JSON.stringify(deptOf)); }catch(e){} }
let deptOf = loadDepts();
function deptFor(name){ const v = OLD[deptOf[name]] || deptOf[name]; return DEPTS.includes(v) ? v : "ETC"; }

// 분과: 과 아래에 내가 직접 만드는 세부 분류
const SKEY = "surgerySubs", SOKEY = "surgerySubOf";
function loadObj(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }
let subs = loadObj(SKEY), subOf = loadObj(SOKEY);
function storeSubs(){ try{ localStorage.setItem(SKEY, JSON.stringify(subs)); localStorage.setItem(SOKEY, JSON.stringify(subOf)); }catch(e){} }
function subFor(name){ const s = subOf[name]; return (s && (subs[deptFor(name)] || []).includes(s)) ? s : ""; }

// 집도의: {이름, 과, 분과} 목록
const DOCKEY = "surgerySurgeons";
function loadDocs(){ try{ const d = JSON.parse(localStorage.getItem(DOCKEY)); if (Array.isArray(d)) return d; }catch(e){} return []; }
let docs = loadDocs();
let docSelDept = null, docSelSub = null;
function docCount(name){ return logs.filter(l => l.doc === name).length; }
function storeDocs(){ try{ localStorage.setItem(DOCKEY, JSON.stringify(docs)); }catch(e){} }
function docDept(o){ return DEPTS.includes(o.dept) ? o.dept : "ETC"; }
function docSub(o){ return (o.sub && (subs[docDept(o)] || []).includes(o.sub)) ? o.sub : ""; }

// 수술 방식 항목
const APPR = ["복강경", "개복", "로봇", "기타"];

// 2) RPG 규칙: 수술 하나당 얻는 XP
function calcXP(s, isNewType){
  let xp = 10 + s.diff * 5;                 // 기본 + 난이도
  xp += Math.floor((s.min || 0) / 30) * 2;  // 30분마다 +2
  if (isNewType) xp += 15;                  // 새로운 종류 보너스
  if (s.memo && s.memo.trim().length >= 10) xp += 5; // 메모 보너스
  return xp;
}
const TITLES = ["신규 견습생","수술실 새싹","든든한 보조","믿음직한 손","수술방 에이스","베테랑","수술실의 전설"];
function levelOf(xp){ return Math.floor(Math.sqrt(xp / 25)) + 1; }
function xpFor(level){ return (level - 1) * (level - 1) * 25; }

// 3) 화면 그리기
const $ = id => document.getElementById(id);
function streak(){
  const days = new Set(logs.map(l => l.date));
  let n = 0, d = new Date();
  if (!days.has(d.toISOString().slice(0,10))) d.setDate(d.getDate() - 1);
  while (days.has(d.toISOString().slice(0,10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function render(){
  const xp = logs.reduce((a,l)=>a+l.xp,0), lv = levelOf(xp);
  const lo = xpFor(lv), hi = xpFor(lv + 1);
  $("lv").textContent = lv;
  $("title").textContent = TITLES[Math.min(lv - 1, TITLES.length - 1)];
  $("xpbar").style.width = ((xp - lo) / (hi - lo) * 100) + "%";
  $("xptext").textContent = `${xp} XP · 다음 레벨까지 ${hi - xp} XP`;
  $("sCount").textContent = logs.length;
  $("sTypes").textContent = new Set(logs.map(l=>l.name)).size;
  $("sStreak").textContent = streak();
  $("who").textContent = profile ? `${profile.name} 님 · ${dday(profile.hire)}` : "";
  fillDepts();
  renderTypes();
  renderSubs();
  renderDocs();
  fillAppr();
  
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("list").innerHTML = logs.slice().reverse().map(l => `
    <div class="item"><button class="del" data-id="${l.id}">삭제</button><button class="ed" data-eid="${l.id}">수정</button>
    <b>${esc(l.name)}</b><br>
    <span class="tag">${l.date}</span><span class="tag">${deptFor(l.name)}${subFor(l.name) ? " · " + esc(subFor(l.name)) : ""}</span><span class="tag">${l.role}</span>${l.doc ? `<span class="tag">집도의 ${esc(l.doc)}</span>` : ""}${l.appr ? `<span class="tag">${l.appr}</span>` : ""}<span class="tag">난이도 ${l.diff}</span><span class="tag">+${l.xp}XP</span>
    ${l.memo ? `<div class="sub">${esc(l.memo)}</div>` : ""}</div>`).join("") || '<p class="sub">아직 기록이 없어요.</p>';
  renderDash();
  renderRecent();
}

// 수술 목록 그리기 + 추가/삭제
function renderTypes(){
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sel = $("name"), prev = sel.value;
  sel.innerHTML = types.length
    ? DEPTS.filter(d => types.some(t => deptFor(t) === d)).map(d => `<optgroup label="${d}">` + types.filter(t => deptFor(t) === d).sort((a, b) => sortMode === "count" ? countOf(b) - countOf(a) : 0).map(t => `<option>${esc(t)}</option>`).join("") + "</optgroup>").join("")
    : "<option value=''>먼저 분과/집도의 탭에서 수술을 추가해 주세요</option>";
  if (types.includes(prev)) sel.value = prev;
  const row = i => {
    const t = types[i], n = logs.filter(l => l.name === t).length;
    const opts = DEPTS.map(d => `<option${d === deptFor(t) ? " selected" : ""}>${d}</option>`).join("");
    const sopts = "<option value=''>분과 없음</option>" + (subs[deptFor(t)] || []).map(s => `<option${s === subFor(t) ? " selected" : ""}>${esc(s)}</option>`).join("");
    return `<div class="item"><button class="del" data-i="${i}">삭제</button><button class="ed" data-i="${i}">수정</button><span class="grip" data-i="${i}">☰</span>${esc(t)} <span class="tag">${n}회</span><div style="margin-top:4px">${apprTags(t)}</div><div><select class="dsel" data-i="${i}">${opts}</select><select class="ssel" data-i="${i}">${sopts}</select></div></div>`;
  };
  const withItems = DEPTS.filter(d => types.some(t => deptFor(t) === d));
  if (!withItems.includes(selDept)) selDept = withItems[0] || null;
  let body = "";
  if (selDept) {
    const inDept = types.map((t, i) => i).filter(i => deptFor(types[i]) === selDept).sort((a, b) => sortMode === "count" ? countOf(types[b]) - countOf(types[a]) : 0);
    const subKeys = [...new Set(inDept.map(i => subFor(types[i])))];
    if (selSub !== "all" && !subKeys.includes(selSub)) selSub = "all";
    const chip = (key, label, n) => `<button class="sbtn${key === selSub ? " on" : ""}" data-s="${esc(key)}">${esc(label)} ${n}</button>`;
    const hasSub = subKeys.some(k => k);
    body = `<div class="chips">` + (hasSub ? chip("all", "전체", inDept.length) + subKeys.map(k => chip(k, k || "분과 없음", inDept.filter(i => subFor(types[i]) === k).length)).join("") : "") + `</div>`
      + `<div class="sub" style="margin:4px 0 2px">정렬 <button class="srt${sortMode === "count" ? " on" : ""}" data-m="count">횟수순</button><button class="srt${sortMode === "manual" ? " on" : ""}" data-m="manual">직접 정렬 (☰를 끌어서 이동)</button></div>` + inDept.filter(i => selSub === "all" || subFor(types[i]) === selSub).map(row).join("");
  }
  $("typeList").innerHTML = withItems.length
    ? `<div class="dgrid">` + withItems.map(d => `<button class="dbtn${d === selDept ? " on" : ""}" data-d="${esc(d)}">${esc(d)} <span>${types.filter(t => deptFor(t) === d).length}</span></button>`).join("") + `</div>` + body
    : '<p class="sub">아직 추가한 수술이 없어요.</p>';
}

// 집도의 목록: 과·분과별로 묶어서 보여 줍니다
function h(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function docGroups(){ const g = []; DEPTS.forEach(d => ["", ...(subs[d] || [])].forEach(s => g.push([d, s]))); return g; }
function fillDocSub(){
  const el = $("docSub"), v = el.value, d = $("docDept").value;
  el.innerHTML = "<option value=''>분과 없음</option>" + (subs[d] || []).map(s => `<option>${h(s)}</option>`).join("");
  if ((subs[d] || []).includes(v)) el.value = v;
}
function renderDocs(){
  fillDocSub();
  const inGroup = (o, d, s) => docDept(o) === d && docSub(o) === s;
  const sel = $("doc"), prev = sel.value;
  sel.innerHTML = "<option value=''>집도의 선택 안 함</option>" + docGroups().map(([d, s]) => {
    const list = docs.filter(o => inGroup(o, d, s)).sort((a, b) => docCount(b.name) - docCount(a.name));
    return list.length ? `<optgroup label="${h(d)}${s ? " · " + h(s) : ""}">` + list.map(o => `<option>${h(o.name)}</option>`).join("") + "</optgroup>" : "";
  }).join("");
  if (docs.some(o => o.name === prev)) sel.value = prev;
  const row = i => {
    const o = docs[i], n = logs.filter(l => l.doc === o.name).length;
    const dopts = DEPTS.map(d => `<option${d === docDept(o) ? " selected" : ""}>${h(d)}</option>`).join("");
    const sopts = "<option value=''>분과 없음</option>" + (subs[docDept(o)] || []).map(s => `<option${s === docSub(o) ? " selected" : ""}>${h(s)}</option>`).join("");
    return `<div class="item"><button class="del" data-i="${i}">삭제</button>${h(o.name)} <span class="tag">${n}회</span><div><select class="dsel" data-i="${i}">${dopts}</select><select class="ssel" data-i="${i}">${sopts}</select></div></div>`;
  };
  const withItems = DEPTS.filter(d => docs.some(o => docDept(o) === d));
  if (!withItems.includes(docSelDept)) docSelDept = withItems[0] || null;
  let body = "";
  if (docSelDept) {
    const inDept = docs.map((o, i) => i).filter(i => docDept(docs[i]) === docSelDept).sort((a, b) => docCount(docs[b].name) - docCount(docs[a].name));
    const subKeys = [...new Set(inDept.map(i => docSub(docs[i])))];
    if (docSelSub !== null && docSelSub !== "all" && !subKeys.includes(docSelSub)) docSelSub = null;
    const chip = (key, label, n) => `<button class="sbtn${key === docSelSub ? " on" : ""}" data-s="${h(key)}">${h(label)} ${n}</button>`;
    body = `<div class="chips">` + (subKeys.length > 1 ? chip("all", "전체", inDept.length) : "") + subKeys.map(k => chip(k, k || "분과 없음", inDept.filter(i => docSub(docs[i]) === k).length)).join("") + `</div>`
      + (docSelSub === null ? '<p class="sub">분과 버튼을 누르면 집도의 목록이 보여요.</p>' : inDept.filter(i => docSelSub === "all" || docSub(docs[i]) === docSelSub).map(row).join(""));
  }
  $("docList").innerHTML = withItems.length
    ? `<div class="dgrid">` + withItems.map(d => `<button class="dbtn${d === docSelDept ? " on" : ""}" data-d="${h(d)}">${h(d)} <span>${docs.filter(o => docDept(o) === d).length}</span></button>`).join("") + `</div>` + body
    : '<p class="sub">아직 추가한 집도의가 없어요.</p>';
}

});
let drag = null;
$("typeList").addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip");
  if (!g) return;
  e.preventDefault();
  drag = { i: +g.dataset.i, el: g.closest(".item"), over: null };
  drag.el.classList.add("drag");
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
$("typeList").addEventListener("pointermove", e => {
  if (!drag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const it = t && t.closest("#typeList .item");
  if (drag.over && drag.over !== it) drag.over.classList.remove("over");
  drag.over = (it && it !== drag.el && it.querySelector(".grip")) ? it : null;
  if (drag.over) drag.over.classList.add("over");
});
function endDrag(drop){
  if (!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove("drag");
  if (d.over) d.over.classList.remove("over");
  if (!drop || !d.over) return;
  const to = +d.over.querySelector(".grip").dataset.i;
  const moved = types.splice(d.i, 1)[0];
  types.splice(to, 0, moved);
  storeTypes();
  if (sortMode !== "manual") { setSort("manual"); say("직접 정렬 모드로 바꾸었어요"); }
  render();
}
$("typeList").addEventListener("pointerup", () => endDrag(true));

// 수술별 대시보드: 수술 버튼 → 집도의별 카드(횟수 · 수술 방식 · 메모)
function renderDash(){
  const names = [...types];
  logs.forEach(l => { if (!names.includes(l.name)) names.push(l.name); });
  names.sort((a, b) => countOf(b) - countOf(a));
  if (!names.length) { $("list").innerHTML = '<p class="sub">아직 추가한 수술이 없어요.</p>'; return; }
  if (!names.includes(dashName)) dashName = names[0];
  const btns = names.map(n => `<button class="nbtn${n === dashName ? " on" : ""}" data-n="${h(n)}">${h(n)} <span>${countOf(n)}</span></button>`).join("");
  const mine = logs.filter(l => l.name === dashName).reverse();
  const groups = {};
  mine.forEach(l => { const k = l.doc || ""; (groups[k] = groups[k] || []).push(l); });
  const keys = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
  const cards = keys.map(k => {
    const arr = groups[k], ap = {};
    arr.forEach(l => { const a = l.appr || "방식 미선택"; ap[a] = (ap[a] || 0) + 1; });
    const apTags = Object.entries(ap).sort((a, b) => b[1] - a[1]).map(([a, c]) => `<span class="tag">${h(a)} ${c}</span>`).join("");
    const memos = arr.map(l => `<div class="memo"><div class="mt">${l.appr ? `<div><span class="tag">${h(l.appr)}</span></div>` : ""}<div>${l.memo && l.memo.trim() ? h(l.memo) : '<span class="sub">메모 없음</span>'}</div></div><button class="ed" data-mid="${l.id}">수정</button></div>`).join("");
    const key = dashName + "|" + k, open = openCards.has(key);
    const note = prefNotes[key] || "";
    const prefBox = k ? `<div class="pref"><div><div class="pt">📌 이 수술 노트</div><div class="pb">${note.trim() ? h(note) : '<span class="sub">아직 노트가 없어요. 수정을 눌러 적어 보세요</span>'}</div></div><button class="ed" data-pk="${h(key)}">수정</button></div>` : "";
    return `<div class="dcard"><div class="dhead" data-k="${h(key)}"><div class="dtitle">${open ? "▾" : "▸"} ${k ? "🩺 " + h(k) : "집도의 미지정"} <span class="tag">${arr.length}회</span></div><div>${apTags}</div></div>${prefBox}${open ? memos : ""}</div>`;
  }).join("");
  $("list").innerHTML = `<div class="ngrid">${btns}</div><div class="dh" style="margin-top:6px">${h(dashName)} · 총 ${mine.length}회</div>` + (cards || '<p class="sub">아직 이 수술의 기록이 없어요.</p>');
}

// 프로필: 처음 실행 시 이름·입사일을 저장하고, 입사일로부터 D+일수를 표시
const PKEY = "surgeryProfile";
function loadProfile(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY)); if (p && p.name && p.hire) return p; }catch(e){}
  return null;
}
let profile = loadProfile();
function dday(hire){
  const a = new Date(hire + "T00:00:00"), n = new Date();
  n.setHours(0, 0, 0, 0);
  const d = Math.round((n - a) / 86400000);
  return d >= 0 ? `D+${String(d).padStart(2, "0")}일` : `D${d}일`;
}

// 백업 / 복원: 앱의 모든 저장 데이터를 JSON 한 덩어리로 내보내고 되살림
const BKEYS = ["surgeryLog", "surgeryTypes", "surgeryCustomDepts", "surgeryDepts", "surgerySubs", "surgerySubOf", "surgerySurgeons", "surgerySort", "surgeryProfile", "surgeryPrefNotes"];
function makeBackup(){
  const data = {};
  BKEYS.forEach(k => { try{ const v = localStorage.getItem(k); if (v !== null) data[k] = v; }catch(e){} });
  return JSON.stringify({ app: "surgery-rpg", version: 1, savedAt: new Date().toISOString(), data }, null, 1);
}
function stamp(){ const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
function showBackupInfo(){
  let t = ""; try{ t = localStorage.getItem("surgeryLastBackup") || ""; }catch(e){}
  $("bkInfo").textContent = t ? "마지막 백업: " + t : "아직 백업한 적이 없어요.";
}
function markBackup(){ try{ localStorage.setItem("surgeryLastBackup", new Date().toLocaleDateString("ko-KR")); }catch(e){} showBackupInfo(); }
$("bkSave").onclick = async () => {
  let dl = null;
  try{ dl = window.claude && await window.claude.use("downloads"); }catch(e){}
  if (!dl) { await saveBackupFallback(); return; }
  try{
    await dl.save({ filename: `수술실생존일기-백업-${stamp()}.json`, data: makeBackup() });
    markBackup(); say("백업 파일을 저장했어요");
  }catch(err){ if (!err || err.code !== "declined") say("저장에 실패했어요. '백업 내용 복사'를 이용해 주세요"); }
};
$("bkCopy").onclick = async () => {
  const txt = makeBackup();
  try{ await navigator.clipboard.writeText(txt); markBackup(); say("백업 내용을 복사했어요. 메모 앱 등에 붙여넣어 보관하세요"); return; }catch(e){}
  const ta = $("bkText"); ta.value = txt; ta.focus(); ta.select();
  say("복사가 막혀 있어요. 아래 칸의 내용을 직접 복사해 주세요");
};
function restoreFrom(text){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ say("백업 형식이 올바르지 않아요"); return; }
  if (!obj || obj.app !== "surgery-rpg" || !obj.data || typeof obj.data !== "object") { say("이 앱의 백업이 아니에요"); return; }
  try{ if (obj.data.surgeryLog && !Array.isArray(JSON.parse(obj.data.surgeryLog))) throw 0; }catch(e){ say("백업 내용이 손상되었어요"); return; }
  ask("지금 앱에 있는 모든 기록을 이 백업 내용으로 바꿔요. 계속할까요?", "복원").then(ok => {
    if (!ok) return;
    BKEYS.forEach(k => { try{ if (typeof obj.data[k] === "string") localStorage.setItem(k, obj.data[k]); else localStorage.removeItem(k); }catch(e){} });
    say("복원했어요. 화면을 새로 불러와요 (안 되면 앱을 다시 열어 주세요)");
    setTimeout(() => { try{ location.reload(); }catch(e){} }, 1200);
  });
}
$("bkFile").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => restoreFrom(String(r.result));
  r.readAsText(f);
  e.target.value = "";
};
$("bkRestore").onclick = () => {
  const t = $("bkText").value.trim();
  if (!t) { say("붙여넣은 내용이 없어요"); return; }
  restoreFrom(t);
};
showBackupInfo();

// 일반 브라우저/홈 화면 앱용 백업 저장: 공유 시트(파일에 저장) → 다운로드 링크 순서로 시도
async function saveBackupFallback(){
  const name = `수술실생존일기-백업-${stamp()}.json`, text = makeBackup();
  try{
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      markBackup(); say("백업 파일을 저장했어요"); return;
    }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markBackup(); say("백업 파일을 저장했어요");
  }catch(e){ say("파일 저장이 안 돼요. '백업 내용 복사'를 이용해 주세요"); }
}

// 오프라인 사용 준비 상태 표시 (설정 탭)
(async function offlineInfo(){

    el.textContent = (reg && reg.active && n >= 2)

  }catch(e){ el.textContent = "📴 오프라인 사용: 확인할 수 없어요"; }
})();

// 최근 경험: 수술별 마지막 수행일(소독·순회 각각)과 복습 필요 상태
const RECENT_OK = 30, RECENT_WARN = 90;
let recentFilter = "all";
function renderRecent(){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const daysSince = ds => Math.max(0, Math.round((today - new Date(ds + "T00:00:00")) / 86400000));
  const map = {};
  logs.forEach(l => {
    if (!l.date) return;
    const m = map[l.name] = map[l.name] || { n: 0, last: "", scrub: "", circ: "" };
    m.n++;
    if (l.date > m.last) m.last = l.date;
    if (l.role === "소독간호사" && l.date > m.scrub) m.scrub = l.date;
    if (l.role === "순회간호사" && l.date > m.circ) m.circ = l.date;
  });
  const rows = Object.entries(map).map(([name, m]) => {
    const d = daysSince(m.last);
    return { name, m, d, st: d <= RECENT_OK ? "ok" : d <= RECENT_WARN ? "check" : "review" };
  }).sort((a, b) => b.d - a.d);
  const cnt = k => rows.filter(r => r.st === k).length;
  const lab = { ok: "최근", check: "점검", review: "복습 필요" };
  const chips = [["all", `전체 ${rows.length}`], ["review", `복습 필요 ${cnt("review")}`], ["check", `점검 ${cnt("check")}`]]
    .map(([k, t]) => `<button class="srt${recentFilter === k ? " on" : ""}" data-r="${k}">${t}</button>`).join("");
  const roleTxt = (label, ds) => ds ? `${label} ${daysSince(ds)}일 전` : `${label} 기록 없음`;
  const list = rows.filter(r => recentFilter === "all" || r.st === recentFilter).map(r =>
    `<div class="rrow"><div style="min-width:0"><div class="rname">${h(r.name)}</div><div class="rsub">총 ${r.m.n}회 · ${roleTxt("소독", r.m.scrub)} · ${roleTxt("순회", r.m.circ)}</div></div>`
    + `<div class="rday ${r.st}">${r.d}일 전<div><span class="rbadge ${r.st}">${lab[r.st]}</span></div></div></div>`).join("");
  $("recentBox").innerHTML = rows.length
    ? `<div style="margin-bottom:4px">${chips}</div>` + (list || '<p class="sub">해당하는 수술이 없어요.</p>')
      + `<div class="sub" style="border-top:1px solid var(--line);padding-top:8px">최근 0~${RECENT_OK}일 · 점검 ${RECENT_OK + 1}~${RECENT_WARN}일 · 복습 필요 ${RECENT_WARN + 1}일 이상</div>`
    : '<p class="sub">수술을 기록하면 마지막 수행일이 여기에 나와요.</p>';
}
$("recentBox").addEventListener("click", e => {
  const b = e.target.closest(".srt");
  if (b) { recentFilter = b.dataset.r; renderRecent(); }
});

$("date").value = new Date().toISOString().slice(0,10);

  $("memo").value = "";
  const t = $("toast"); t.textContent = after > before ? `🎉 레벨 업! LV ${after}` : `+${s.xp} XP 획득!`;
  t.style.display = "block"; setTimeout(() => t.style.display = "none", 2000);
  render();
};
$("list").onclick = async e => {

};

// 오프라인 사용: 서비스 워커 등록 (GitHub Pages 같은 https 주소에서만)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  // 새 버전(sw.js의 CACHE 이름이 바뀐 것)이 설치되면 화면을 한 번 새로고침해서 바로 보여 주기
  //    단, 뭔가 입력하던 중이면 지우지 않도록 화면 아래에 '눌러서 새로고침' 안내만 띄우기
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false, typing = false;
  document.addEventListener("input", () => { typing = true; }, true);
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    if (!typing) { reloaded = true; location.reload(); return; }
    if (document.getElementById("updateBar")) return;
    const bar = document.createElement("button");
    bar.id = "updateBar";
    bar.textContent = "🔄 새 버전이 있어요. 입력을 마친 뒤 눌러서 새로고침";
    bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;padding:12px;border:0;border-radius:12px;background:#333;color:#fff;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)";
    bar.onclick = () => { reloaded = true; location.reload(); };
    document.body.appendChild(bar);
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(reg => {
        // 앱을 켜 둔 채 다시 화면으로 돌아왔을 때도 새 버전이 있는지 확인
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
      })
      .catch(() => {});
  });
}
